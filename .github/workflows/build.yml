name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar proyecto Android
        run: |
          flutter create --platforms=android --org com.agrosenser --project-name agrosenser360 build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' build_app/android/app/src/main/AndroidManifest.xml
      - name: Compilar
        working-directory: build_app
        shell: bash
        run: |
          flutter pub get
          flutter build apk --release 2>&1 | tee ../build.log
      - name: Resumen del error
        if: failure()
        run: |
          echo "===== MOTIVO DEL FALLO ====="
          grep -n -B2 -A12 -E "What went wrong|error:|Error:" build.log | head -n 80
      - uses: actions/upload-artifact@v4
        with:
          name: agrosenser360-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
